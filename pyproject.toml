[project]
name = "anvil-template"
version = "0.2.0"
description = "給單人 + AI 代理人協作的專案起手樣板：規則檔、狀態檔、三種紀錄、doctor 檢查與 commit hook"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["anvil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 本機系統暫存目錄有權限問題時，改用專案內暫存（由 .gitignore 擋）
addopts = "--basetemp=.pytest_tmp"

# ── Anvil doctor 的設定 ─────────────────────────────────────────
# 開新專案時改 package；其餘通常不動。
[tool.anvil]
package = "anvil"              # 含 __version__ 的套件目錄
docs_dir = "docs"
status_file = "STATUS.md"
limits_file = "docs/limits.md" # 既有專案可指向自己的限制總帳，不必改名（見 docs/extending.md）
tasks_dir = "docs/tasks"
decisions_dir = "docs/decisions"
archive_dir = "docs/archive"
max_active_tasks = 1           # 同時 active 的任務單上限
status_stale_days = 14         # STATUS.md 的 Updated 落後最近 commit 超過這天數 → 警告
# 額外納管的文件（延伸點，可多組）：讓專案自己的規劃檔吃同一套中繼資料檢查
# [[tool.anvil.governed]]
# glob = "routes/**/PLAN.md"
# kind = "task"                # task | adr | general

# 額外的帳本（延伸點，可多組）：與 limits.md 同格式（# | 首見 | 內容 | 處置 | 狀態 | 解除條件 | 證據），各自的編號前綴
# [[tool.anvil.ledgers]]
# file = "docs/tech_debt.md"
# prefix = "D"

# 耦合宣告（延伸點，可多組）：變更命中 when 時 require 也必須在變更內；doctor 在 commit 前檢查
[[tool.anvil.coupled]]
when = "tools/doctor.py"
require = ["tests/test_doctor.py", "CHANGELOG.md"]
reason = "doctor 是樣板的產品本體：改它要有測試與變更紀錄"
agents_max_lines = 150
sensitive_globs = [".env", ".env.*", "credentials.json", "token.json", "cookie.txt", "*.db", "*.sqlite"]
